<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAX</title>
<meta name="description" content="PAX: rip packs of Taloki, football and basketball cards. Play money only.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PAX">
<link rel="icon" type="image/png" href="images/brand/pax-favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/brand/pax-app-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&family=Anton&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="splash" id="splash"><img src="images/brand/pax-logo.webp" alt="PAX"></div>
<div class="appFrame">
<header class="top">
  <div class="catWrap">
    <button class="catBtn" id="catBtn" aria-haspopup="true"><span class="ci" id="catIco"></span><span id="catName">Taloki</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="catMenu" id="catMenu" hidden></div>
  </div>
  <div class="wallet"><div class="bal" id="bal">$0.00</div><button class="add" id="addFunds" aria-label="Add play money"><span>+</span></button></div>
</header>

<main>
  <section class="view on" id="v-packs">
    <div class="pkStage">
      <div class="pkCar" id="pkCar"></div>
      <div class="pkLoad" id="pkLoad"></div>
    </div>
    <div class="pkInfo">
      <h2 class="pkTitle" id="pkTitle"></h2>
      <button class="insideBtn" id="insideBtn"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>What's inside</button>
      <div class="pkStats">
        <div class="psL"><span>Min Value</span><b id="pkMin"></b></div>
        <button class="psR" id="styleBtn"><span>Pack style</span><b><em id="pkStyle">Normal</em><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></b></button>
      </div>
      <div class="qtySeg" id="qtySeg" role="group" aria-label="How many packs"></div>
      <button class="buyBig" id="buyBtn">Buy</button>
    </div>
  </section>

  <section class="view" id="v-show">
    <h1>Showroom</h1>
    <p class="sub">Your best pulls across Taloki, NFL and NBA.</p>
    <div id="showroom"></div>
  </section>

  <section class="view" id="v-col">
    <h1>Collection</h1>
    <div class="statrow" id="colStats"></div>
    <div class="actions">
      <button class="ghost" id="sellCommons">Sell all commons &amp; uncommons</button>
      <button class="ghost" id="sellDupes">Sell all duplicates</button>
    </div>
    <div class="seg colSeg" id="colSeg"><button data-cv="cards" class="on">Cards</button><button data-cv="evo">Evolutions</button></div>
    <div id="cvCards">
      <h2 id="colSetName">Set</h2>
      <div class="chips" id="chips"></div>
      <div class="grid" id="colGrid"></div>
    </div>
    <div id="cvEvo" hidden>
      <h2 id="altTitle">Evolution lines</h2>
      <p class="sub" id="evoSum"></p>
      <div id="evoList"></div>
    </div>
  </section>

  <section class="view" id="v-hist">
    <h1>History</h1>
    <p class="sub">Your last 100 pulls.</p>
    <div id="history"></div>
  </section>

  <section class="view" id="v-me">
    <h1>Account</h1>
    <div id="profile"></div>
  </section>
</main>

<div class="installBar" id="installBar" hidden></div>

<nav class="nav">
  <button class="on" data-v="packs"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="16" rx="2"/><path d="M8 3h9a2 2 0 0 1 2 2v13"/></svg><span>Packs</span></button>
  <button data-v="show"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></svg><span>Showroom</span></button>
  <button data-v="col"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="16" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="3.5" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="16" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="3.5" y="16" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="16" width="4.5" height="4.5" rx="1"/><rect x="16" y="16" width="4.5" height="4.5" rx="1"/></svg><span>Collection</span></button>
  <button data-v="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></button>
  <button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3.2"/><path d="M6.2 18.4c1.3-2.3 3.4-3.4 5.8-3.4s4.5 1.1 5.8 3.4"/></svg><span>Account</span></button>
</nav>
</div>

<div class="bs" id="bs"><div class="bsIn" id="bsIn"></div></div>
<div class="stage" id="stage" aria-live="polite"></div>
<div class="burst" id="burst"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="js/data.js"></script>
<script src="js/sports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
